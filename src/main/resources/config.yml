mob-drop:
  spawner:
    min: 3
    max: 5
  no-spawner:
    min: 1
    max: 3

death-percent: # Сколько % денег снимается при смерти
  default: 10
  knight: 9
  king: 8
  titan: 7
  griefer: 6
  legenda: 5
  emperor: 4
  povel: 3
  support: 1

boosters: # Бустер настраивается для каждой группы
  default: 1.0
  knight: 1.25
  king: 1.5
  titan: 1.75
  griefer: 2.0
  legenda: 2.5
  emperor: 3.0
  povel: 4.0
  support: 5.0

death:
  message: "§6ꜰᴜsɪᴏɴᴍɪɴᴇ §7» &fВы потеряли &c{money} ⛂ &fза смерть от игрока &7{player} ({percent}%)"
  sendTitle:
    enabled: true
    title: "&4&lПОТРАЧЕНО"
    subtitle: "&fНадоело умирать? &fПокупай донат &fи &cубивай &fвсех!"

kill:
  player:
    message: "§6ꜰᴜsɪᴏɴᴍɪɴᴇ §7» &fВы заработали &6{money} ⛂ &fза убийство игрока &7{player}"
  mob:
    actionbar: "&fВы заработали &6{money} ⛂ &fза убийство моба &e{mob} &7(x{booster})"

